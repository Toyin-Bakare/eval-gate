<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
<title id="title">EVAL-GATE / HOW A PROMPT VERSION IS GATED</title><desc id="desc">Dataset and runner feed a per-case run and score loop. Three rule-based scorers produce scores from zero to one. Aggregate scores, latency and cost are compared against thresholds. All checks must pass. The gate produces a pass or fail exit code and report.json.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#94a3b8"/></marker>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;fill:#fff}.heading{font-size:32px;font-weight:750;letter-spacing:1px}.label{font-size:14px;font-weight:650;letter-spacing:2px;fill:#cbd5e1}.title{font-size:18px;font-weight:700}.mono{font-family:Consolas,monospace;font-size:14px}.flow{fill:none;stroke:#94a3b8;stroke-width:2;stroke-linejoin:round;marker-end:url(#arrow)}</style></defs>
<rect width="1600" height="1040" fill="#0f172a"/>
<rect x="40" y="40" width="5" height="44" rx="2.5" fill="#38bdf8"/>
<text x="62" y="73" class="heading">EVAL-GATE / HOW A PROMPT VERSION IS GATED</text>
<text x="62" y="106">Run every case. Score the outputs. Require every threshold to pass.</text>
<path d="M40 133H1560" stroke="#334155"/>
<text x="40" y="185" class="label">INPUTS</text><text x="370" y="185" class="label">EVALUATION LOOP</text><text x="990" y="185" class="label">AGGREGATION + GATE</text><text x="1400" y="185" class="label">VERDICT</text>
<rect x="370" y="220" width="590" height="425" rx="14" fill="#131e32" stroke="#334155" stroke-width="1.2"/><rect x="370" y="235" width="4" height="395" rx="2" fill="#a78bfa"/>
<text x="386" y="252" class="title">For each case</text>
<text x="390" y="283" class="label">01</text>
<rect x="400" y="315" width="530" height="105" rx="14" fill="#182438" stroke="#334155" stroke-width="1.2"/><rect x="400" y="330" width="4" height="75" rx="2" fill="#38bdf8"/>
<text x="416" y="347" class="title">Run</text>
<text x="416" y="379">runner(case) → text, latency, cost</text>
<text x="390" y="457" class="label">02  SCORE</text>
<rect x="400" y="480" width="170" height="126" rx="14" fill="#182438" stroke="#334155" stroke-width="1.2"/><rect x="400" y="495" width="4" height="96" rx="2" fill="#a78bfa"/>
<text x="416" y="544">contains /</text>
<text x="416" y="566">not_contains /</text>
<text x="416" y="588">regex checks</text>
<text x="416" y="511" class="mono">task_completion</text>
<rect x="580" y="480" width="170" height="126" rx="14" fill="#182438" stroke="#334155" stroke-width="1.2"/><rect x="580" y="495" width="4" height="96" rx="2" fill="#a78bfa"/>
<text x="596" y="544">share of sentences</text>
<text x="596" y="566">that overlap context</text>
<text x="596" y="511" class="mono">groundedness</text>
<rect x="760" y="480" width="170" height="126" rx="14" fill="#182438" stroke="#334155" stroke-width="1.2"/><rect x="760" y="495" width="4" height="96" rx="2" fill="#a78bfa"/>
<text x="776" y="544">JSON parses,</text>
<text x="776" y="566">required keys</text>
<text x="776" y="588">present</text>
<text x="776" y="511" class="mono">format_validity</text>
<text x="400" y="631">Each scorer outputs 0–1</text>
<path d="M665 420V444H485V480" class="flow"/>
<path d="M665 444V480" class="flow"/>
<path d="M665 444H845V480" class="flow"/>
<path d="M900 237H936V273H900V248" class="flow"/>
<text x="741" y="259">Repeat for each case</text>
<rect x="40" y="220" width="290" height="110" rx="14" fill="#182438" stroke="#334155" stroke-width="1.2"/><rect x="40" y="235" width="4" height="80" rx="2" fill="#38bdf8"/>
<text x="56" y="252" class="title">Dataset (JSONL)</text>
<text x="56" y="284">one case per line:</text>
<text x="56" y="306">id, input, expected, context</text>
<rect x="40" y="365" width="290" height="165" rx="14" fill="#182438" stroke="#334155" stroke-width="1.2"/><rect x="40" y="380" width="4" height="135" rx="2" fill="#60a5fa"/>
<text x="56" y="397" class="title">Runner (module:function)</text>
<text x="56" y="429">Case in, RunResult(text,</text>
<text x="56" y="451">latency_ms, cost_usd) out</text>
<text x="56" y="490">the prompt and model live here,</text>
<text x="56" y="512">not in eval-gate</text>
<rect x="40" y="575" width="290" height="190" rx="14" fill="#182438" stroke="#334155" stroke-width="1.2"/><rect x="40" y="590" width="4" height="160" rx="2" fill="#fbbf24"/>
<text x="56" y="607" class="title">Thresholds (JSON)</text>
<text x="56" y="639">task_completion ≥</text>
<text x="56" y="661">groundedness ≥</text>
<text x="56" y="683">format_validity ≥</text>
<text x="56" y="705">latency_p95_ms ≤</text>
<text x="56" y="727">cost_per_case_usd ≤</text>
<path d="M330 270H370" class="flow"/>
<path d="M330 400H400" class="flow"/>
<rect x="990" y="450" width="170" height="155" rx="14" fill="#182438" stroke="#334155" stroke-width="1.2"/><rect x="990" y="465" width="4" height="125" rx="2" fill="#2dd4bf"/>
<text x="1006" y="482" class="title">Aggregate</text>
<text x="1006" y="514">mean per scorer ·</text>
<text x="1006" y="536">latency p95 ·</text>
<text x="1006" y="558">mean cost per case</text>
<rect x="1200" y="450" width="160" height="155" rx="14" fill="#182438" stroke="#334155" stroke-width="1.2"/><rect x="1200" y="465" width="4" height="125" rx="2" fill="#fbbf24"/>
<text x="1216" y="482" class="title">Gate</text>
<text x="1216" y="514">compare each</text>
<text x="1216" y="536">aggregate to its</text>
<text x="1216" y="558">threshold;</text>
<text x="1216" y="580">all must pass</text>
<path d="M960 520H990" class="flow"/>
<path d="M1160 520H1200" class="flow"/>
<path d="M330 675H350V710H1240V605" class="flow"/>
<text x="990" y="698">Thresholds</text>
<rect x="1400" y="370" width="160" height="112" rx="14" fill="#12332e" stroke="#334155" stroke-width="1.2"/><rect x="1400" y="385" width="4" height="82" rx="2" fill="#34d399"/>
<text x="1416" y="402" class="title">PASS</text>
<text x="1416" y="434">exit 0 — version</text>
<text x="1416" y="456">may be promoted</text>
<rect x="1400" y="530" width="160" height="112" rx="14" fill="#351f2c" stroke="#334155" stroke-width="1.2"/><rect x="1400" y="545" width="4" height="82" rx="2" fill="#f87171"/>
<text x="1416" y="562" class="title">FAIL</text>
<text x="1416" y="594">exit 1 —</text>
<text x="1416" y="616">merge blocked</text>
<path d="M1360 520H1380V426" fill="none" stroke="#94a3b8" stroke-width="2"/>
<path d="M1380 426H1400" class="flow"/>
<path d="M1380 520V586H1400" class="flow"/>
<rect x="990" y="755" width="570" height="105" rx="14" fill="#182438" stroke="#334155" stroke-width="1.2"/><rect x="990" y="770" width="4" height="75" rx="2" fill="#2dd4bf"/>
<text x="1006" y="787" class="title">report.json</text>
<text x="1006" y="819">prompt_ref · aggregates · thresholds · checks · passed · per-case scores</text>
<path d="M1320 605V755" class="flow"/>
<text x="1335" y="691">Write report</text>
<rect x="40" y="886" width="1520" height="58" rx="14" fill="#182438" stroke="#334155" stroke-width="1.2"/><rect x="40" y="901" width="4" height="28" rx="2" fill="#38bdf8"/>
<text x="60" y="922" class="mono">In CI: eval-gate run --dataset --runner --thresholds --prompt-ref --out → non-zero exit fails the job</text>
<text x="40" y="978" font-style="italic">Scorers are rule-based. Groundedness is lexical overlap with the context; it rewards staying close to the source, it does not verify truth.</text>
<path d="M40 995H1560" stroke="#334155"/>
<text x="40" y="1024" class="label">v0.1 • SEPTEMBER 2026 • github.com/Toyin-Bakare/eval-gate</text>
</svg>
