[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eval-gate"
version = "0.1.0"
description = "Score a prompt version against a dataset and pass or fail it against thresholds. Runs in CI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Toyin O. Bakare" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
eval-gate = "eval_gate.cli:main"

[project.urls]
Homepage = "https://github.com/Toyin-Bakare/eval-gate"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
